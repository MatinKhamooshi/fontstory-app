# Builds and tests every push to master. When VERSION_NAME in gradle.properties
# is a version that has no tag yet, it also signs the APK, creates the annotated
# tag vX.Y.Z and publishes a GitHub Release with the APK and changelog notes.
name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the tag and create the release
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid VERSION_NAME '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — build & test only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$VERSION — will release."
          fi

      - name: Prepare signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Fetch test fonts
        run: |
          mkdir -p testfonts && cd testfonts
          npm pack vazirmatn@33 --silent
          tar xzf vazirmatn-*.tgz

      - name: Build & test
        run: ./gradlew assembleGithubRelease bundlePlayRelease testGithubReleaseUnitTest testPlayReleaseUnitTest --no-daemon

      - name: Collect APK
        id: apk
        run: |
          APK="FontStory-${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/github/release/app-github-release*.apk "$APK"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "FontStory-${{ steps.ver.outputs.version }}-play.aab"
          echo "aab=FontStory-${{ steps.ver.outputs.version }}-play.aab" >> "$GITHUB_OUTPUT"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # Google Play bundle (upload manually in Play Console)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.aab }}
          path: ${{ steps.apk.outputs.aab }}
          retention-days: 90

      - name: Refuse unsigned release
        if: steps.ver.outputs.release == 'true' && env.HAS_KEY != 'true'
        run: |
          echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Not publishing an unsigned release."
          exit 1

      - name: Tag & publish release
        if: steps.ver.outputs.release == 'true' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          # Release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$VERSION" > notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "FontStory $VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" "$APK" \
            --title "FontStory $VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: Clean up secrets
        if: always()
        run: rm -rf keystore keystore.properties
